# E2E (Playwright) como workflow reutilizable: lo invoca ci.yml (job `e2e`) y entra en `ci-ok`.
# Corre la matriz completa en cada PR y cada push: chromium (2 shards), mobile, flags-off, firefox y webkit.
# No tiene triggers propios, concurrency ni check aparte: hereda evento y concurrencia de CI.
name: E2E

on:
  workflow_call:

permissions: {}

jobs:
  # Compila el dist/ una sola vez (production con todos los flags activos, scripts/build-e2e.ts)
  # y lo comparte con los jobs de la matriz: ninguno ejecuta `vite build`.
  # `pnpm build:e2e` compila también dist-flags-off/ (proyecto `flags-off`); ambos dirs viajan
  # en el mismo artefacto.
  build:
    name: e2e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compilar (production, con los feature flags activos)
        env:
          VITE_GIT_SHA: e2e
          VITE_GIT_DATE: 1970-01-01T00:00:00+00:00
        run: pnpm build:e2e # dist/ (flags activos) y dist-flags-off/ (todos apagados)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dist
          path: |
            dist/
            dist-flags-off/
            dist-panel/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.project }}${{ matrix.tag }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, shard: 1/2, tag: -s1 }
          - { project: chromium, browser: chromium, shard: 2/2, tag: -s2 }
          - { project: mobile, browser: chromium, shard: '', tag: '' }
          - { project: flags-off, browser: chromium, shard: '', tag: '' }
          - { project: firefox, browser: firefox, shard: '', tag: '' }
          - { project: webkit, browser: webkit, shard: '', tag: '' }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-dist
          path: .
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Instalar navegador y dependencias
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Instalar dependencias del sistema
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - name: Ejecutar E2E
        env:
          SHARD: ${{ matrix.shard }}
          # En PR se corta tras 20 fallos (la señal ya es clara y ahorra minutos); en push
          # se ejecuta todo para tener la lista completa de fallos.
          MAX_FAILURES: ${{ github.event_name == 'pull_request' && '--max-failures=20' || '' }}
        run: pnpm e2e:ci --project=${{ matrix.project }} ${SHARD:+--shard=$SHARD} $MAX_FAILURES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}${{ matrix.tag }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

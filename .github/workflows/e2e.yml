# E2E (Playwright) en su propio workflow, separado de CI a propósito.
#
# deploy.yml se dispara cuando CI termina; si los e2e vivieran en CI, el deploy de beta esperaría
# a que acabaran. Aquí corren en paralelo y sin bloquear el despliegue.
#   - PR a develop: solo chromium (2 shards) + mobile + flags-off; un fallo se ve en su check pero no bloquea.
#   - push a develop/master, PR a master y cron nocturno: también firefox y webkit.
#   - PR a master: `e2e-ok` es el check obligatorio de producción (exigirlo en la protección de master).
name: E2E

on:
  pull_request:
  push:
    branches: [develop, master]
  # Pasada completa nocturna (los PR a develop no ejecutan firefox/webkit).
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Compila el dist/ una sola vez (production con todos los flags activos, scripts/build-e2e.ts)
  # y lo comparte con los jobs de la matriz: ninguno ejecuta `vite build`.
  # Aquí también se decide la matriz:
  #   - PR a develop: chromium (2 shards) + mobile + flags-off. Firefox/WebKit no comparan capturas y rara vez
  #     fallan solos; no compensa su coste en cada PR.
  #   - push a develop/master, PR a master (necesario para `e2e-ok`) y cron: todos los proyectos.
  # `pnpm build:e2e` compila también dist-flags-off/ (proyecto `flags-off`); ambos dirs viajan
  # en el mismo artefacto.
  build:
    name: e2e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Planificar matriz
        id: plan
        env:
          FULL: ${{ github.event_name != 'pull_request' || github.base_ref == 'master' }}
        run: |
          base='{"project":"chromium","browser":"chromium","shard":"1/2","tag":"-s1"},{"project":"chromium","browser":"chromium","shard":"2/2","tag":"-s2"},{"project":"mobile","browser":"chromium","shard":"","tag":""},{"project":"flags-off","browser":"chromium","shard":"","tag":""}'
          extra='{"project":"firefox","browser":"firefox","shard":"","tag":""},{"project":"webkit","browser":"webkit","shard":"","tag":""}'
          if [ "$FULL" = "true" ]; then list="$base,$extra"; else list="$base"; fi
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
      - name: Compilar (production, con los feature flags activos)
        env:
          VITE_GIT_SHA: e2e
          VITE_GIT_DATE: 1970-01-01T00:00:00+00:00
        run: pnpm build:e2e # dist/ (flags activos) y dist-flags-off/ (todos apagados)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dist
          path: |
            dist/
            dist-flags-off/
            dist-panel/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.project }}${{ matrix.tag }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-dist
          path: .
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Instalar navegador y dependencias
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Instalar dependencias del sistema
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}
      - name: Ejecutar E2E
        env:
          SHARD: ${{ matrix.shard }}
          # En PR se corta tras 20 fallos (la señal ya es clara y ahorra minutos); en push/cron
          # se ejecuta todo para tener la lista completa de fallos.
          MAX_FAILURES: ${{ github.event_name == 'pull_request' && '--max-failures=20' || '' }}
        run: pnpm e2e:ci --project=${{ matrix.project }} ${SHARD:+--shard=$SHARD} $MAX_FAILURES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}${{ matrix.tag }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Check de producción: solo existe en PR/push a master; en el resto se omite (no bloquea).
  # En esos eventos la matriz es completa, así que ningún job queda omitido.
  e2e-ok:
    name: e2e-ok
    if: ${{ always() && (github.base_ref == 'master' || github.ref == 'refs/heads/master') }}
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Comprobar resultado de los e2e
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::Los e2e no terminaron correctamente."
            exit 1
          fi

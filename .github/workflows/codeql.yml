# Escaneo de seguridad CodeQL para JavaScript/TypeScript (T11, §21.13).
# Las alertas aparecen en Security > Code scanning.
name: CodeQL

on:
  pull_request:
  push:
    branches: [develop, master]
  schedule:
    - cron: '23 4 * * 1' # semanal (lunes), también sobre la rama por defecto
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          # security-extended: más consultas de seguridad que el conjunto por defecto.
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - dist-flags-off
              - dist-beta
              - dist-production
              - coverage
              - reports
              - playwright-report
              - test-results
              - e2e/__screenshots__
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript

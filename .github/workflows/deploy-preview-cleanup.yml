# Limpieza de previews (T12, docs/requisitos.md §22.9): al cerrar una PR se borra su Worker
# `prognosports-pr-<n>`. Usa `pull_request_target` para correr el YAML de la rama base y poder
# usar secretos; NO hace checkout del código de la PR (solo de la rama base, para el wrangler fijado).
name: Deploy preview cleanup

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: borrar preview
    # Solo PRs del mismo repositorio (las de forks nunca tuvieron preview).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # actualizar el comentario de la PR
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Para pull_request_target el checkout por defecto es la rama base, no la PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
      - name: Borrar Worker de preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # Si la PR nunca llegó a desplegar preview, el borrado falla: no es un error.
          pnpm exec wrangler delete --name "prognosports-pr-${PR_NUMBER}" --force \
            || echo "::notice::No había preview que borrar para la PR #${PR_NUMBER}."
      - name: Actualizar comentario
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- prognosports-preview -->'
          id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))] | first | .id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" \
              -f body="${marker}
          Preview eliminado al cerrar la PR." >/dev/null
          fi

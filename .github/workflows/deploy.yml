# Despliegue en Cloudflare Workers Static Assets (T12, docs/requisitos.md §22, docs/deploy.md).
#
# Diseño de seguridad:
#   - Se dispara con `workflow_run` al terminar CI con éxito. Corre siempre con el YAML de la
#     rama por defecto y con acceso a secretos, por eso NUNCA ejecuta código de una PR:
#     descarga el artefacto `dist-*` ya construido por CI (contrato en ci.yml) y usa el wrangler
#     fijado en el lockfile de la rama por defecto (PR) o de la rama desplegada (develop/master).
#   - Previews solo para PRs del mismo repositorio (nunca forks).
#   - Los secretos viven en entornos de GitHub (`preview`, `beta`, `production`) y solo se
#     inyectan en el paso que ejecuta wrangler, no en la instalación de dependencias.
#   - develop -> beta (automático); master -> producción (entorno `production` con aprobación).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  preview:
    name: preview (PR)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read # descargar el artefacto del run de CI
      pull-requests: write # comentario con la URL de preview
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Rama por defecto (github.sha en workflow_run): nunca el código de la PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
      # Modo beta: incluye VITE_PREVIEW=true (panel de flags de T6) y usa la API de producción.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-beta
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # Un Worker por PR: permite borrarlo al cerrar la PR (deploy-preview-cleanup.yml).
      - name: Desplegar preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler deploy --name "prognosports-pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${HEAD_SHA}"
          url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH" | head -n1)"
          case "$url" in
            https://prognosports-pr-*.workers.dev*) ;;
            *) echo "::error::No se pudo obtener la URL de preview ($url)"; exit 1 ;;
          esac
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke-deploy.sh "$URL"
      - name: Comentar URL en la PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- prognosports-preview -->'
          body="${marker}
          **Preview desplegado**: ${URL}

          Commit \`${HEAD_SHA:0:7}\`. Se elimina al cerrar la PR."
          id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))] | first | .id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  beta:
    name: beta (develop)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: beta
      url: https://prognosports-beta.workers.dev
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-beta
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Desplegar beta
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler deploy --name prognosports-beta \
            --message "beta @ ${HEAD_SHA}"
          url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH" | head -n1)"
          case "$url" in
            https://prognosports-beta.*workers.dev*) ;;
            *) echo "::error::No se pudo obtener la URL de beta ($url)"; exit 1 ;;
          esac
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke-deploy.sh "$URL"

  production:
    name: production (master)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Aprobación manual: el entorno `production` debe tener «Required reviewers» (docs/deploy.md).
    # Los secretos del entorno no se entregan hasta que un revisor aprueba.
    environment:
      name: production
      url: https://prognosports.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-production
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Desplegar producción
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          pnpm exec wrangler deploy --name prognosports \
            --message "production @ ${HEAD_SHA}"
          url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH" | head -n1)"
          case "$url" in
            https://prognosports.*workers.dev*) ;;
            *) echo "::error::No se pudo obtener la URL de producción ($url)"; exit 1 ;;
          esac
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: bash scripts/smoke-deploy.sh "$URL"

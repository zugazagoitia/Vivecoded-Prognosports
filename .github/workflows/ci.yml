# CI de PrognoSports (T11, docs/requisitos.md §21).
#
# Contrato del artefacto de build (lo consumen los jobs de deploy de T12):
#   - Un artefacto por modo de Vite: `dist-beta` y `dist-production`.
#   - Cada uno contiene el contenido de `dist/` en su raíz (sin carpeta `dist/` extra).
#   - Se construye una sola vez, con VITE_GIT_SHA / VITE_GIT_DATE del commit probado.
#   - Retención corta (7 días); el deploy debe descargar el artefacto, nunca reconstruir.
name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

# Una ejecución por rama o PR; un push nuevo cancela la anterior (§21.6).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Sin permisos por defecto; cada job declara los suyos (§21.4).
permissions: {}

jobs:
  # Detecta PR/push que no tocan código (documentación, workflows, ajustes de editor, licencia...):
  # en ese caso se omiten lint, typecheck, test, coverage, audit, size y e2e (sigue build, que necesita
  # el despliegue). `ci-ok` lo tiene en cuenta.
  # No se usa `paths-ignore` a nivel de workflow: dejaría `ci-ok` pendiente para siempre (docs/ci.md).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Comprobar si hay cambios de código
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ -n "$BASE_SHA" ] && ! echo "$BASE_SHA" | grep -Eq '^0+$' \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)"
            # Rutas que no afectan al código ni al build: docs, markdown, .github, editor y licencia.
            if [ -n "$files" ] && ! echo "$files" | grep -Evq '^(docs/|\.github/|\.vscode/|\.editorconfig$|\.gitignore$|LICENSE|.*\.md$)'; then
              code=false
            fi
            echo "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Cambios de código: $code"

  lint:
    name: lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # Cobertura en GitHub (docs/ci.md#cobertura). Nunca bloquea: no está en `needs` de ci-ok.
  coverage:
    name: coverage
    needs: [changes, test]
    # Forks y Dependabot: el token es de solo lectura, no se sube ni se comenta.
    if: ${{ needs.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # descargar el artefacto de cobertura de develop (delta)
      code-quality: write # subida nativa a GitHub Code Quality
      pull-requests: write # comentario de respaldo (y detectar la PR en push)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage/
      - name: Subir cobertura a GitHub Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        continue-on-error: true
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: false
      - name: Informe de cobertura (resumen y comentario)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.base_ref || 'develop' }}
        run: bash scripts/coverage-report.sh

  audit:
    name: audit
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      # Falla con vulnerabilidades high o critical en dependencias de producción (§21.13).
      - run: pnpm audit --prod --audit-level high

  build:
    name: build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [beta, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historial completo: el clon superficial no basta para resolver el commit probado (§21.7).
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Calcular VITE_GIT_SHA y VITE_GIT_DATE
        env:
          # En PR, github.sha es el merge commit; se prueba y se despliega el head real.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "VITE_GIT_SHA=$(git rev-parse --short "$COMMIT_SHA")" >> "$GITHUB_ENV"
          echo "VITE_GIT_DATE=$(git log -1 --format=%cI "$COMMIT_SHA")" >> "$GITHUB_ENV"
      # El typecheck ya corre en su propio job; aquí solo se compila.
      - run: pnpm exec vite build --mode ${{ matrix.mode }}
        env:
          ANALYZE: 'true'
          # Source maps a Sentry (T14): solo si los secretos existen (no en PRs de forks).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.VITE_CF_ANALYTICS_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report-${{ matrix.mode }}
          path: reports/bundle.html
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.mode }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  size:
    name: size
    needs: [changes, build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-production
          path: dist/
      # `pnpm size` (T14) lee dist/: scripts/bundle-budget.ts + .size-limit.json.
      - name: Presupuesto de bundle
        run: |
          if node -e "process.exit(require('./package.json').scripts?.size ? 0 : 1)"; then
            pnpm run size
          else
            echo "::notice::Script 'size' no definido todavía (T14); presupuesto omitido."
          fi

  # E2E (Playwright, matriz completa) como workflow reutilizable: .github/workflows/e2e.yml.
  # Va dentro de CI para que `ci-ok` sea el único check obligatorio; deploy.yml espera a que termine.
  e2e:
    name: e2e
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  # Check único y estable para la protección de ramas (§21.10): falla si cualquier job falla.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [changes, lint, typecheck, test, audit, build, size, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Comprobar resultado de los jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS"
          # Sin cambios de código: los jobs omitidos a propósito no cuentan como fallo.
          if [ "$CODE" = "false" ]; then PATTERN='"(failure|cancelled)"'; else PATTERN='"(failure|cancelled|skipped)"'; fi
          if echo "$RESULTS" | grep -Eq "$PATTERN"; then
            echo "::error::Algún job de CI no terminó correctamente."
            exit 1
          fi

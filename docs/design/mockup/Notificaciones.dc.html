<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
<script src="seed.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}

.nt{display:flex;gap:16px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--border);color:inherit;text-decoration:none}
.nt:hover{background:var(--surface-hover);text-decoration:none}
.nt.unread{background:var(--tint)}
.nt .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:16px;flex:none}
.dh{padding:10px 20px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-muted)}

</style>
</helmet>
<div class="pg">
  <dc-import name="AppNav" active="perfil" hint-size="100%,56px"></dc-import>
  <main class="pg-main md">
    <div class="row sp wrapf" style="align-items:flex-end"><div class="col" style="gap:2px"><h1 class="t-title">Notificaciones</h1><p class="muted">{{unread}} sin leer</p></div><div class="row g8"><button type="button" class="btn btn-outline btn-sm" onClick="{{readAll}}"><span class="i s16">done_all</span>Marcar todas como leídas</button><a class="btn btn-ghost btn-sm" href="Ajustes.dc.html#avisos"><span class="i s16">tune</span>Preferencias</a></div></div>
    <div class="row g8 wrapf" role="group" aria-label="Filtrar"><sc-for list="{{filters}}" as="f" hint-placeholder-count="6"><button type="button" class="chip {{f.cls}}" onClick="{{f.pick}}">{{f.l}} <span class="muted tn">{{f.n}}</span></button></sc-for></div>
    <section class="card" style="overflow:hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div class="dh">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="x" hint-placeholder-count="3"><a class="nt {{x.cls}}" href="{{x.href}}"><span class="av s40" style="background:{{x.tb}};color:{{x.tf}}"><span class="i">{{x.icon}}</span></span><div class="col fx" style="gap:2px"><div class="row g8 wrapf"><b class="hd">{{x.t}}</b><span class="tag tg-gray">{{x.type}}</span></div><span class="t-sm muted">{{x.d}}</span><span class="t-cap muted">{{x.when}} · por {{x.ch}}</span></div><sc-if value="{{x.unread}}" hint-placeholder-val="{{ false }}"><i class="dot" aria-label="Sin leer"></i></sc-if></a></sc-for>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><div class="empty"><div class="ic"><span class="i s24">notifications_off</span></div><b class="hd">No hay avisos de este tipo</b></div></sc-if>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const P = window.PG, s = this.state || {}, n = P.N, me = 'alex', O = P.order;
    const I = [
      ['Hoy', 'alarm', 'Cierra el sprint de Singapur', 'Faltan 1 h 32 min y aún no has pronosticado.', 'hace 5 min', 'Alerta de sesión', 'warn', 'Pronosticar.dc.html', 1, 'Telegram'],
      ['Hoy', 'swap_vert', 'Cambio en la parrilla del sprint', 'BOT saldrá desde el pit lane por un cambio de alerón.', 'hace 40 min', 'Cambios en la parrilla', 'info', 'GPDetalle.dc.html', 1, 'Telegram'],
      ['Ayer', 'emoji_events', 'Puntos de la clasificación sprint', 'Has sumado 11 de 15 puntos. Sofía, Irene, Nuria y Hugo la clavaron.', 'ayer, 18:42', 'Puntos repartidos', 'ok', 'Resultados.dc.html', 0, 'correo y Telegram'],
      ['Ayer', 'event_upcoming', 'Mañana empieza el GP de Singapur', 'La clasificación sprint cierra el viernes a las 17:25.', 'ayer, 9:00', 'Pre-alerta de sesión', 'info', 'GPDetalle.dc.html', 0, 'correo y Telegram'],
      ['Esta semana', 'emoji_events', 'Puntos del GP de Azerbaiyán', 'Has sumado ' + P.pts.alex[16] + ' puntos y quedas ' + P.gpRank.alex[16] + '.º del GP.', 'hace 6 días', 'Puntos repartidos', 'ok', 'Resultados.dc.html', 0, 'correo'],
      ['Esta semana', 'campaign', 'Nuevo: «Mi temporada»', 'Mira tu año de un vistazo.', 'hace 6 días', 'Información', 'brand', 'MiTemporada.dc.html', 0, 'correo']
    ];
    const read = !!s.read, f = s.f || 'all';
    const TYPES = ['Alerta de sesión', 'Pre-alerta de sesión', 'Cambios en la parrilla', 'Puntos repartidos', 'Información'];
    const list = I.filter((x) => f === 'all' || (f === 'unread' ? x[8] && !read : x[5] === f));
    const groups = []; list.forEach((x) => { let g = groups[groups.length - 1]; if (!g || g.name !== x[0]) { g = { name: x[0], items: [] }; groups.push(g); } g.items.push({ icon: x[1], t: x[2], d: x[3], when: x[4], type: x[5], tb: x[6] === 'brand' ? 'var(--tint)' : 'var(--' + x[6] + '-tint)', tf: x[6] === 'brand' ? 'var(--tint-fg)' : 'var(--' + x[6] + '-fg)', href: x[7], unread: !!x[8] && !read, cls: x[8] && !read ? 'unread' : '', ch: x[9] }); });
    const unread = read ? 0 : I.filter((x) => x[8]).length;
    return {
      unread: unread ? unread + ' avisos' : 'Ningún aviso', groups, none: list.length === 0, readAll: () => this.setState({ read: true }),
      filters: [['all', 'Todas', I.length], ['unread', 'Sin leer', unread]].concat(TYPES.map((t) => [t, t, I.filter((x) => x[5] === t).length])).map((x) => ({ l: x[1], n: x[2], cls: x[0] === f ? 'on' : '', pick: () => this.setState({ f: x[0] }) }))
    };
  }
}
</script>
</body>
</html>

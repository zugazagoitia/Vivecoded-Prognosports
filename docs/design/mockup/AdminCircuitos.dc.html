<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Circuitos (admin)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
<script src="seed.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0}.ro{background:var(--surface-muted);color:var(--muted)}</style>
</helmet>
<div class="pg">
  <dc-import name="AppNav" active="admin" admin="true" hint-size="100%,56px"></dc-import>
  <main class="pg-main">
    <div class="side-l" style="grid-template-columns:240px minmax(0,1fr)">
      <div class="sticky"><dc-import name="AdminSide" active="circuitos" hint-size="240px,420px"></dc-import></div>
      <div class="col g24" style="min-width:0">
<div class="row sp wrapf"><div class="col" style="gap:2px"><h1 class="t-title">Circuitos</h1><p class="muted">Catálogo de circuitos y variantes.</p></div><div class="row g8 wrapf"><a class="btn btn-primary" href="AdminCircuitoEditar.dc.html"><span class="i s16">add</span>Nuevo circuito</a></div></div>
<section class="card"><div class="tw"><table class="tbl tn"><thead><tr><th>Circuito</th><th>País</th><th class="r">Variantes</th><th class="r">Longitud</th><th></th></tr></thead><tbody><sc-for list="{{rows}}" as="c" hint-placeholder-count="8"><tr><td><b class="hd">{{c.n}}</b></td><td>{{c.c}}</td><td class="r">{{c.v}}</td><td class="r">{{c.l}} km</td><td class="r"><a class="btn btn-ghost btn-sm" href="AdminCircuitoEditar.dc.html">Editar</a></td></tr></sc-for></tbody></table></div></section>
      </div>
    </div>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const P = window.PG, s = this.state || {}, n = P.N;
    return { rows: [['Marina Bay Street Circuit', 'Singapur', 1, '4,940'], ['Suzuka', 'Japón', 1, '5,807'], ['Baku City Circuit', 'Azerbaiyán', 1, '6,003'], ['Monza', 'Italia', 2, '5,793'], ['Spa-Francorchamps', 'Bélgica', 1, '7,004'], ['Silverstone', 'Reino Unido', 2, '5,891']].map((x) => ({ n: x[0], c: x[1], v: x[2], l: x[3] })) };
  }
}
</script>
</body>
</html>

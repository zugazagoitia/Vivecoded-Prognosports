<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera del ranking</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="col g12" style="font-family:Inter,system-ui,sans-serif;color:var(--body)">
  <div class="row sp wrapf" style="align-items:flex-end">
    <div class="col" style="gap:2px"><h1 class="t-title">Ranking</h1><p class="muted">Amigos del paddock · Fórmula 1 {{season}} · {{done}}</p></div>
    <div class="row g12 wrapf" style="align-items:flex-end">
      <div class="field"><label class="lbl" for="rk-com">Comunidad</label><select id="rk-com" class="sel" style="width:auto"><option>Amigos del paddock</option><option>Oficina F1</option><option>Peña Madring</option></select></div>
      <div class="col" style="gap:4px"><span class="lbl">Temporada</span><div class="seg" role="group" aria-label="Temporada"><sc-for list="{{seasons}}" as="y" hint-placeholder-count="4"><button type="button" class="sg {{y.cls}}" onClick="{{y.pick}}">{{y.l}}</button></sc-for></div></div>
    </div>
  </div>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="24" aria-valuenow="17" aria-label="Progreso de la temporada"><i style="width:71%"></i></div>
  <nav class="tabs" aria-label="Secciones del ranking"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="7"><a class="tab {{t.cls}}" href="{{t.href}}" aria-current="{{t.cur}}">{{t.l}}</a></sc-for></nav>
  <sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}"><div class="row g8 wrapf" role="navigation" aria-label="Vistas"><sc-for list="{{subs}}" as="x" hint-placeholder-count="3"><a class="chip {{x.cls}}" href="{{x.href}}" style="text-decoration:none">{{x.l}}<sc-if value="{{x.flag}}" hint-placeholder-val="{{ false }}"><span class="flag" style="margin-left:2px">flag</span></sc-if></a></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"RankingResumen","options":["RankingResumen","Clasificacion","Matriz","HeatmapGP","Distribucion","Sesiones","Gap","Bump","Titulo","AciertosTipo","Consistencia","CaraACara","MiTemporada","Palmares"]},"$preview":{"width":1440,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'RankingResumen', s = this.state || {}, season = s.y || 2026;
    const G = [
      ['Resumen', [['RankingResumen', 'Resumen', 0]]],
      ['Clasificación', [['Clasificacion', 'General', 0]]],
      ['Por Gran Premio', [['Matriz', 'Tabla', 0], ['HeatmapGP', 'Mapa de calor', 1], ['Distribucion', 'Distribución', 1], ['Sesiones', 'Por sesión', 1]]],
      ['Evolución', [['Gap', 'Diferencias', 1], ['Bump', 'Posiciones', 1], ['Titulo', 'Lucha por el título', 1]]],
      ['Aciertos', [['AciertosTipo', 'Por sesión', 1], ['Consistencia', 'Regularidad', 1]]],
      ['Comparar', [['CaraACara', 'Cara a cara', 1], ['MiTemporada', 'Mi temporada', 1]]],
      ['Palmarés', [['Palmares', 'Palmarés', 1]]]
    ];
    const gi = G.findIndex((g) => g[1].some((x) => x[0] === a));
    const subs = G[gi < 0 ? 0 : gi][1];
    return {
      season, done: season === 2026 ? '17 de 24 Grandes Premios disputados' : 'temporada cerrada',
      seasons: [2026, 2025, 2024, 2023].map((y) => ({ l: y === 2026 ? '2026 · en curso' : String(y), cls: y === season ? 'on' : '', pick: () => this.setState({ y }) })),
      tabs: G.map((g, i) => ({ l: g[0], href: g[1][0][0] + '.dc.html', cls: i === gi ? 'on' : '', cur: i === gi ? 'page' : 'false' })),
      hasSub: subs.length > 1, subs: subs.map((x) => ({ l: x[1], href: x[0] + '.dc.html', cls: x[0] === a ? 'on' : '', flag: !!x[2] }))
    };
  }
}
</script>
</body>
</html>

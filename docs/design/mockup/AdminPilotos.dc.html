<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pilotos y equipos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
<script src="seed.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0}.ro{background:var(--surface-muted);color:var(--muted)}</style>
</helmet>
<div class="pg">
  <dc-import name="AppNav" active="admin" admin="true" hint-size="100%,56px"></dc-import>
  <main class="pg-main">
    <div class="side-l" style="grid-template-columns:240px minmax(0,1fr)">
      <div class="sticky"><dc-import name="AdminSide" active="pilotos" hint-size="240px,420px"></dc-import></div>
      <div class="col g24" style="min-width:0">
<div class="row sp wrapf"><div class="col" style="gap:2px"><h1 class="t-title">Pilotos y equipos</h1><p class="muted">Catálogo de la temporada 2026.</p></div><div class="row g8 wrapf"><button type="button" class="btn btn-outline"><span class="i s16">add</span>Nuevo equipo</button><button type="button" class="btn btn-primary"><span class="i s16">add</span>Nuevo piloto</button></div></div>
<div class="tabs" role="tablist"><button type="button" class="tab on">Pilotos</button><button type="button" class="tab">Equipos</button></div>
<section class="card"><div class="tw"><table class="tbl tn"><thead><tr><th>N.º</th><th>Piloto</th><th>Código</th><th>Equipo</th><th></th></tr></thead><tbody><sc-for list="{{rows}}" as="d" hint-placeholder-count="22"><tr><td>{{d.no}}</td><td><b class="hd">{{d.name}}</b></td><td>{{d.code}}</td><td><span class="row g8"><span class="team" style="background:{{d.color}};height:18px"></span>{{d.team}}</span></td><td class="r"><button type="button" class="btn btn-ghost btn-sm">Editar</button></td></tr></sc-for></tbody></table></div></section>
      </div>
    </div>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const P = window.PG, s = this.state || {}, n = P.N;
    return { rows: P.drivers };
  }
}
</script>
</body>
</html>

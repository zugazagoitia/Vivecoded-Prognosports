<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Posición en la general</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
<script src="seed.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media(max-width:1000px){.lay{grid-template-columns:minmax(0,1fr)}}
.axis{display:flex;justify-content:space-between;margin:2px 0 0 calc(5% - 18px);width:calc(70% + 36px)}
.axis .xl{width:36px;padding:2px 0}
.st{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:4px}
.st.me{background:var(--tint);font-weight:700}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
</style>
</helmet>
<div class="pg">
  <dc-import name="AppNav" active="ranking" hint-size="100%,56px"></dc-import>
  <main class="pg-main">
    <dc-import name="RankNav" active="Bump" hint-size="100%,200px"></dc-import>
    <section class="card">
      <div class="card-h"><div class="col" style="gap:0"><div class="row g8"><h2 class="t-head">Posición en la general tras cada GP</h2><span class="flag">flag</span></div><span class="t-sm muted">Tú en morado, los resaltados con color fijo y el resto en gris. Pulsa un GP para ver la clasificación de ese momento.</span></div>
        <div class="row g8 wrapf"><div class="seg" role="group" aria-label="Foco"><sc-for list="{{focus}}" as="f" hint-placeholder-count="3"><button type="button" class="sg {{f.cls}}" onClick="{{f.pick}}">{{f.l}}</button></sc-for></div><div class="seg" role="group" aria-label="Forma"><sc-for list="{{shapes}}" as="f" hint-placeholder-count="2"><button type="button" class="sg {{f.cls}}" onClick="{{f.pick}}">{{f.l}}</button></sc-for></div></div></div>
      <div class="card-b lay">
        <div style="min-width:0">
          <svg viewBox="0 0 1000 440" width="100%" class="chart" role="img" aria-label="Posición en la general de cada jugador tras cada GP">
            <rect x="{{selRx}}" y="6" width="20" height="420" rx="4" style="fill:var(--tint)"></rect>
            <sc-for list="{{yl}}" as="y" hint-placeholder-count="12"><text x="40" y="{{y.y}}" text-anchor="end">{{y.l}}</text></sc-for>
            <sc-for list="{{series}}" as="l" hint-placeholder-count="12"><path d="{{l.d}}" fill="none" style="stroke:{{l.c}};stroke-width:{{l.w}};stroke-linejoin:round;stroke-linecap:round"></path></sc-for>
            <sc-for list="{{dots}}" as="d" hint-placeholder-count="30"><circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" style="fill:{{d.c}};stroke:var(--surface);stroke-width:2"></circle></sc-for>
            <sc-for list="{{labels}}" as="l" hint-placeholder-count="6"><g><circle cx="776" cy="{{l.cy}}" r="10" style="fill:{{l.c}}"></circle><text x="776" y="{{l.ty}}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:11px">{{l.pos}}</text><text x="792" y="{{l.ty}}" class="lbl-s" style="fill:var(--h)">{{l.name}}</text></g></sc-for>
          </svg>
          <div class="axis" role="group" aria-label="Elegir Gran Premio"><sc-for list="{{xl}}" as="x" hint-placeholder-count="17"><button type="button" class="xl {{x.cls}}" onClick="{{x.pick}}" aria-label="{{x.full}}">{{x.l}}</button></sc-for></div>
        </div>
        <aside class="col" style="gap:2px;border-left:1px solid var(--border);padding-left:16px"><span class="up" style="margin-bottom:6px">Tras {{selName}}</span>
          <sc-for list="{{standing}}" as="r" hint-placeholder-count="12"><div class="st {{r.cls}}"><span class="tn muted" style="width:20px">{{r.pos}}</span><i style="background:{{r.c}}"></i><span class="fx ell">{{r.name}}</span><span class="mv {{r.mc}}">{{r.mv}}</span><span class="tn" style="width:36px;text-align:right">{{r.pts}}</span></div></sc-for>
        </aside>
      </div>
      <div class="card-f" style="justify-content:flex-start;flex-wrap:wrap;gap:6px"><span class="up" style="margin-right:6px">Resaltar</span><sc-for list="{{chips}}" as="c" hint-placeholder-count="12"><button type="button" class="pchip {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}"><i style="background:{{c.c}}"></i>{{c.name}}</button></sc-for></div>
    </section>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const P = window.PG, s = this.state || {}, n = P.N, M = P.users.length, me = 'alex', O = P.order, sel = s.sel === undefined ? n - 1 : s.sel, focus = s.focus || 'top', curve = s.shape !== 'line';
    let hl;
    if (s.custom) hl = s.custom.slice();
    else if (focus === 'top') hl = O.slice(0, 5);
    else if (focus === 'near') { const p = O.indexOf(me); hl = O.slice(Math.max(0, p - 2), p + 3); }
    else hl = O.slice();
    hl = hl.filter((id) => id !== me).slice(0, focus === 'all' && !s.custom ? 11 : 5);
    const on = (id) => id === me || hl.indexOf(id) >= 0;
    const col = (id) => id === me ? 'var(--c-you)' : (focus === 'all' && !s.custom) ? 'var(--c-rest)' : P.hue(id, hl);
    const X = (g) => 50 + g * 700 / (n - 1), Y = (r) => 18 + (r - 1) * 396 / (M - 1), dx = 700 / (n - 1);
    const ids = P.users.map((u) => u.id).sort((a, b) => on(a) - on(b) || (a === me) - (b === me));
    const series = ids.map((id) => { const r = P.pos[id]; let d = 'M' + X(0) + ' ' + Y(r[0]); for (let g = 1; g < n; g++) { const x0 = X(g - 1), x1 = X(g), y0 = Y(r[g - 1]), y1 = Y(r[g]); d += curve ? ' C' + (x0 + dx / 2).toFixed(1) + ' ' + y0 + ' ' + (x1 - dx / 2).toFixed(1) + ' ' + y1 + ' ' + x1.toFixed(1) + ' ' + y1 : ' L' + x1.toFixed(1) + ' ' + y1; }
      return { d, c: on(id) ? col(id) : 'var(--c-rest)', w: id === me ? 4 : on(id) ? 2.5 : 1.2 }; });
    const dots = []; ids.filter(on).forEach((id) => { [sel].forEach((g) => dots.push({ x: X(g), y: Y(P.pos[id][g]), r: 5, c: col(id) })); });
    const labels = ids.filter(on).map((id) => ({ cy: Y(P.pos[id][n - 1]), ty: Y(P.pos[id][n - 1]) + 4, pos: P.pos[id][n - 1], name: id === me ? 'Tú' : P.byId[id].name.split(' ')[0], c: col(id) }));
    const st = P.users.map((u) => u.id).sort((a, b) => P.pos[a][sel] - P.pos[b][sel]).map((id) => { const m = sel > 0 ? P.pos[id][sel - 1] - P.pos[id][sel] : 0; return { pos: P.pos[id][sel], name: P.byId[id].name + (id === me ? ' (tú)' : ''), cls: id === me ? 'me' : '', c: on(id) ? col(id) : 'var(--border-input)', pts: P.acc[id][sel], mv: m > 0 ? '▲' + m : m < 0 ? '▼' + (-m) : '', mc: m > 0 ? 'up' : 'dn' }; });
    return {
      focus: [['top', 'Top 5'], ['near', 'Mi entorno'], ['all', 'Todos']].map((x) => ({ l: x[1], cls: !s.custom && x[0] === focus ? 'on' : '', pick: () => this.setState({ focus: x[0], custom: null }) })),
      shapes: [['curve', 'Curvas'], ['line', 'Rectas']].map((x) => ({ l: x[1], cls: (x[0] === 'curve') === curve ? 'on' : '', pick: () => this.setState({ shape: x[0] }) })),
      series, dots, labels, yl: P.users.map((u, i) => ({ y: Y(i + 1) + 4, l: (i + 1) + '.º' })), selRx: X(sel) - 10,
      xl: P.gps.slice(0, n).map((g, i) => ({ l: g.code, full: 'Ver tras ' + g.name, cls: i === sel ? 'on' : '', pick: () => this.setState({ sel: i }) })),
      selName: P.gps[sel].name, standing: st,
      chips: O.map((id) => ({ name: P.byId[id].name + (id === me ? ' (tú)' : ''), on: on(id), cls: on(id) ? 'on' : '', c: on(id) ? col(id) : 'var(--c-rest)',
        pick: () => { if (id === me) return; const cur = hl.slice(); const i = cur.indexOf(id); if (i >= 0) cur.splice(i, 1); else { cur.push(id); if (cur.length > 5) cur.shift(); } this.setState({ custom: cur }); } }))
    };
  }
}
</script>
</body>
</html>

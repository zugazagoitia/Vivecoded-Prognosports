<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva contraseña</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="pg.css">
<script src="theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&amp;display=block" rel="stylesheet">
<style>body{margin:0}.code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.code input{height:52px;text-align:center;font-size:22px;font-weight:600;text-transform:uppercase;padding:0}</style>
</helmet>
<div class="pg">
  <dc-import name="AppNav" user="out" active="ninguno" hint-size="100%,56px"></dc-import>
  <main class="pg-main sm" style="justify-content:center">
    <div class="card">
      <sc-if value="{{form}}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{save}}" class="card-b col" style="gap:20px">
          <div class="col g4"><h1 class="t-sub">Crea una nueva contraseña</h1><p class="t-sm muted">Escribe el código que te hemos enviado a <b class="hd">alex@correo.com</b>.</p></div>
          <div class="field"><label class="lbl" id="cl">Código de 6 caracteres</label>
            <div class="code" role="group" aria-labelledby="cl"><input class="inp" maxlength="1" value="K" aria-label="Carácter 1"><input class="inp" maxlength="1" value="7" aria-label="Carácter 2"><input class="inp" maxlength="1" value="X" aria-label="Carácter 3"><input class="inp" maxlength="1" value="2" aria-label="Carácter 4"><input class="inp" maxlength="1" value="M" aria-label="Carácter 5"><input class="inp" maxlength="1" value="9" aria-label="Carácter 6"></div></div>
          <div class="field"><label class="lbl" for="np">Nueva contraseña</label><div class="iw"><span class="i">lock</span><input id="np" class="inp" type="password" value="NuevaClave2026!" autocomplete="new-password"></div><span class="help">Al menos 8 caracteres.</span></div>
          <div class="field"><label class="lbl" for="np2">Repite la contraseña</label><div class="iw"><span class="i">lock</span><input id="np2" class="inp" type="password" value="NuevaClave2026!" autocomplete="new-password"></div></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Cambiar contraseña</button>
          <div class="row sp t-sm"><span class="muted">¿Código caducado?</span><a href="Recuperar.dc.html">Pedir otro</a></div>
        </form>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <div class="card-b col" style="gap:20px;align-items:flex-start">
          <div class="av s56" style="background:var(--ok-tint);color:var(--ok-fg)"><span class="i s24">check_circle</span></div>
          <div class="col g4"><h1 class="t-sub">Contraseña cambiada</h1><p class="t-sm muted">Ya puedes iniciar sesión con la nueva. Hemos cerrado tus otras sesiones por seguridad.</p></div>
          <a class="btn btn-primary btn-lg btn-block" href="Login.dc.html">Iniciar sesión</a>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const d = !!(this.state && this.state.done);
    return { form: !d, done: d, save: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ done: true }); } };
  }
}
</script>
</body>
</html>
